<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="../registration/register.css">
</head>
<body>

<form action="" method="" id="registerForm">
    <h1>Registration Page</h1>

    <div>
        <label for="user">Username</label>
        <input type="text" id="user" placeholder="Enter the username">
        <span id="uerror" class="error"></span>
    </div>

    <div>
        <label for="pass">Password</label>
        <input type="password" id="pass" placeholder="Enter the password">
        <span id="perror" class="error"></span>
    </div>

    <div>
        <label for="cpass">Confirm Password</label>
        <input type="password" id="cpass" placeholder="Confirm the password">
        <span id="cperror" class="error"></span>
    </div>

    <div>
        <label for="mail">E-mail</label>
        <input type="email" id="mail" placeholder="Enter the email">
        <span id="merror" class="error"></span>
    </div>

    <div>
        <label for="num">Mobile Number</label>
        <input type="text" id="num" placeholder="Enter the mobile number">
        <span id="nerror" class="error"></span>
    </div>

    <div>
        <button type="submit">Register</button>
        <button type="reset">Cancel</button>
    </div>
    <div>
        <form id="registerForm" autocomplete="off">

    </div>
<div>
    <script src="../registration/register.js"></script>
</div>
    <div>
        Already have an account?
        <a href="../login/login.html">Login</a>
    </div>
</form>

</body>
</html>
